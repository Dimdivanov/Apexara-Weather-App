<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="800" height="800">
  <defs>
    <!-- Moon gradient -->
    <radialGradient id="moonGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="60%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#999999"/>
    </radialGradient>

    <!-- Cloud gradient -->
    <linearGradient id="cloudGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>

    <!-- Moon glow -->
    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Moon -->
  <circle cx="22" cy="22" r="12" fill="url(#moonGradient)" filter="url(#moonGlow)" />

  <!-- Main cloud -->
  <g transform="translate(16,26)">
    <ellipse cx="20" cy="10" rx="18" ry="10" fill="url(#cloudGradient)" />
    <circle cx="6" cy="10" r="8" fill="url(#cloudGradient)" />
    <circle cx="32" cy="10" r="8" fill="url(#cloudGradient)" />
  </g>
</svg>

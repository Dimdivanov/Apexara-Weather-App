<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="800" height="800" >
  <defs>
    <!-- Main snowflake gradient for 3D shading -->
    <linearGradient id="snowflakeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#81D4FA"/>
    </linearGradient>
    <!-- Highlight gradient for the edges -->
    <linearGradient id="highlightGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B3E5FC" stop-opacity="0"/>
    </linearGradient>
    <!-- Shadow for subtle depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0288D1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="translate(80,80)">
    <!-- Central hexagon core -->
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="url(#snowflakeGradient)" />
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="url(#highlightGradient)" />

    <!-- 6 main arms rotated every 60deg -->
    <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none">
      <!-- Main stem -->
      <line y1="-50" y2="-15" />
      <!-- Side branches -->
      <line x1="0" y1="-35" x2="12" y2="-45" />
      <line x1="0" y1="-35" x2="-12" y2="-45" />
      <line x1="0" y1="-25" x2="10" y2="-30" />
      <line x1="0" y1="-25" x2="-10" y2="-30" />
    </g>

    <!-- Clone arms rotated by 60 degrees -->
    <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(60)">
      <line y1="-50" y2="-15" />
      <line x1="0" y1="-35" x2="12" y2="-45" />
      <line x1="0" y1="-35" x2="-12" y2="-45" />
      <line x1="0" y1="-25" x2="10" y2="-30" />
      <line x1="0" y1="-25" x2="-10" y2="-30" />
    </g>

    <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(120)">
      <line y1="-50" y2="-15" />
      <line x1="0" y1="-35" x2="12" y2="-45" />
      <line x1="0" y1="-35" x2="-12" y2="-45" />
      <line x1="0" y1="-25" x2="10" y2="-30" />
      <line x1="0" y1="-25" x2="-10" y2="-30" />
    </g>

    <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(180)">
      <line y1="-50" y2="-15" />
      <line x1="0" y1="-35" x2="12" y2="-45" />
      <line x1="0" y1="-35" x2="-12" y2="-45" />
      <line x1="0" y1="-25" x2="10" y2="-30" />
      <line x1="0" y1="-25" x2="-10" y2="-30" />
    </g>

    <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(240)">
      <line y1="-50" y2="-15" />
      <line x1="0" y1="-35" x2="12" y2="-45" />
      <line x1="0" y1="-35" x2="-12" y2="-45" />
      <line x1="0" y1="-25" x2="10" y2="-30" />
      <line x1="0" y1="-25" x2="-10" y2="-30" />
    </g>

    <g stroke="#0288D1" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(300)">
      <line y1="-50" y2="-15" />
      <line x1="0" y1="-35" x2="12" y2="-45" />
      <line x1="0" y1="-35" x2="-12" y2="-45" />
      <line x1="0" y1="-25" x2="10" y2="-30" />
      <line x1="0" y1="-25" x2="-10" y2="-30" />
    </g>
  </g>
</svg>

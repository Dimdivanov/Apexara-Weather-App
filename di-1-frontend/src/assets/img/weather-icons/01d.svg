<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="800" height="800">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff780"/>
      <stop offset="50%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sun core -->
  <circle cx="32" cy="32" r="12" fill="url(#sunGradient)" filter="url(#glow)" />

  <!-- Rays -->
  <g stroke="#fbc02d" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="60" y2="32"/>
    <line x1="12" y1="12" x2="20" y2="20"/>
    <line x1="44" y1="44" x2="52" y2="52"/>
    <line x1="44" y1="20" x2="52" y2="12"/>
    <line x1="12" y1="52" x2="20" y2="44"/>
  </g>
</svg>

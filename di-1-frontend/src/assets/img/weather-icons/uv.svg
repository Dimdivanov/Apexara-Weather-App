<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#fdd835"/>
    </radialGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbc02d" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Sun core -->
  <circle cx="100" cy="100" r="50" fill="url(#sunCore)" filter="url(#sunGlow)"/>

  <!-- UV text -->
  <text x="100" y="112" text-anchor="middle"
        font-size="36" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" fill="#4e342e"
        style="text-shadow: 1px 1px 2px #fff;">
    UV
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="800" height="800">
  <!-- Sun (3D look with gradient) -->
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD93B"/>
      <stop offset="100%" stop-color="#F4B400"/>
    </radialGradient>
    <linearGradient id="cloudGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
  </defs>

  <!-- Sun -->
  <circle cx="50" cy="30" r="12" fill="url(#sunGradient)" />

  <!-- Cloud 1 -->
  <path d="M25 50c-3-4 1-10 7-8 1-4 6-6 10-4 3-2 9-1 10 4 5-1 7 6 3 8H25z"
        fill="url(#cloudGradient)" />

  <!-- Cloud 2 -->
  <path d="M15 56c-3-3 1-8 6-7 1-3 5-5 8-3 2-1 7-1 8 3 4-1 6 5 2 6H15z"
        fill="url(#cloudGradient)" />

  <!-- Cloud 3 (new one) -->
  <path d="M35 58c-3-3 0-7 5-6 1-3 4-5 7-3 2-1 6 0 7 3 3-1 5 4 2 6H35z"
        fill="url(#cloudGradient)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="800" height="800">
  <!-- Gradients -->
  <defs>
    <linearGradient id="cloudLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <linearGradient id="rainGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
  </defs>

  <!-- Cloud 1 (left, puffier) -->
  <path d="M10 50c-2-4 2-9 6-8 1-4 6-6 10-4 2-1 8-1 9 4 4-1 7 5 3 8H10z"
        fill="url(#cloudLight)" />

  <!-- Cloud 2 (center, darker and larger) -->
  <path d="M30 46c-3-5 2-11 7-9 2-5 8-8 13-5 3-2 10 0 12 5 5-3 9 6 4 10H30z"
        fill="url(#cloudDark)" />

  <!-- Cloud 3 (right, puffier) -->
  <path d="M60 50c-2-4 2-9 6-8 1-4 6-6 10-4 2-1 8-1 9 4 4-1 7 5 3 8H60z"
        fill="url(#cloudLight)" />

  <!-- Raindrops under Cloud 1 -->
  <g fill="url(#rainGradient)">
    <ellipse cx="20" cy="70" rx="1.2" ry="4"/>
    <ellipse cx="25" cy="75" rx="1.2" ry="4"/>
    <ellipse cx="30" cy="70" rx="1.2" ry="4"/>
  </g>

  <!-- Raindrops under Cloud 2 -->
  <g fill="url(#rainGradient)">
    <ellipse cx="45" cy="75" rx="1.2" ry="4"/>
    <ellipse cx="50" cy="80" rx="1.2" ry="4"/>
    <ellipse cx="55" cy="75" rx="1.2" ry="4"/>
  </g>

  <!-- Raindrops under Cloud 3 -->
  <g fill="url(#rainGradient)">
    <ellipse cx="65" cy="75" rx="1.2" ry="4"/>
    <ellipse cx="70" cy="80" rx="1.2" ry="4"/>
    <ellipse cx="75" cy="75" rx="1.2" ry="4"/>
  </g>
</svg>

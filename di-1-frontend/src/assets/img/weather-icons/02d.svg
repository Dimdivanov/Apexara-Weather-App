<svg viewBox="0 0 64 64" width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sun gradient -->
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff780"/>
      <stop offset="60%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>

    <!-- Cloud gradient -->
    <linearGradient id="cloudGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>

    <!-- Soft glow for sun -->
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sun (round, behind cloud) -->
  <circle cx="24" cy="24" r="12" fill="url(#sunGradient)" filter="url(#sunGlow)" />

  <!-- Cloud (bigger, covering part of sun) -->
  <g transform="translate(18,26)">
    <ellipse cx="18" cy="10" rx="16" ry="10" fill="url(#cloudGradient)" />
    <circle cx="6" cy="10" r="8" fill="url(#cloudGradient)" />
    <circle cx="30" cy="10" r="7" fill="url(#cloudGradient)" />
  </g>
</svg>

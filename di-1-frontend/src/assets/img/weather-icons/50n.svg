<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="180" height="120">
  <defs>
    <!-- Cloud gradients for 3D puffiness -->
    <radialGradient id="cloudLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#90a4ae" />
    </radialGradient>
    <radialGradient id="cloudShadow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#78909c" />
      <stop offset="100%" stop-color="#455a64" />
    </radialGradient>

    <!-- Mist line gradient -->
    <linearGradient id="mistGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0bec5" />
      <stop offset="50%" stop-color="#eceff1" />
      <stop offset="100%" stop-color="#b0bec5" />
    </linearGradient>

    <!-- Shadow for cloud -->
    <filter id="cloudShadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#455a64" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#cloudShadowFilter)">
    <!-- Puffy cloud base -->
    <ellipse cx="90" cy="60" rx="65" ry="40" fill="url(#cloudLight)" />
    <ellipse cx="55" cy="65" rx="40" ry="35" fill="url(#cloudLight)" />
    <ellipse cx="125" cy="65" rx="45" ry="35" fill="url(#cloudLight)" />
    <ellipse cx="90" cy="50" rx="50" ry="40" fill="url(#cloudShadow)" />
  </g>

  <!-- Mist squiggly lines -->
  <g stroke="url(#mistGradient)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" >
    <path d="M35 95 C55 85, 75 105, 95 95" />
    <path d="M50 105 C70 95, 90 115, 110 105" stroke-width="5" />
    <path d="M65 115 C85 105, 105 125, 125 115" />
  </g>
</svg>

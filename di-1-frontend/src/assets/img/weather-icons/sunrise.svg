<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orangeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD580" />
      <stop offset="100%" stop-color="#FF8C00" />

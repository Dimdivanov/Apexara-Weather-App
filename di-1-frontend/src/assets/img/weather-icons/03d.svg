<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="800" height="800">
  <!-- Gradients -->
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD93B"/>
      <stop offset="100%" stop-color="#F4B400"/>
    </radialGradient>
    <linearGradient id="cloudGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
  </defs>

  <!-- Sun -->
  <circle cx="30" cy="25" r="12" fill="url(#sunGradient)" />

  <!-- Cloud 1 (top right) -->
  <path d="M60 22c-2-3 1-7 5-6 1-3 5-4 8-2 2-1 6-1 7 2 3-1 5 4 2 6H60z"
        fill="url(#cloudGradient)" />

  <!-- Cloud 2 (bottom left) -->
  <path d="M10 55c-2-3 1-7 5-6 1-3 5-4 8-2 2-1 6-1 7 2 3-1 5 4 2 6H10z"
        fill="url(#cloudGradient)" />

  <!-- Cloud 3 (bottom right, enlarged) -->
  <path d="M50 62c-3-4 0-9 6-8 2-4 6-6 10-4 3-2 9 0 10 4 4-2 7 5 3 8H50z"
        fill="url(#cloudGradient)" />
</svg>
